server {
    listen 80 default_server;
    server_name _;

    root /var/www/fmapp/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 15m;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://localhost:4000/health;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        alias /var/www/fmapp/backend/uploads/;
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/fm.catalystsolutions.eco/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fm.catalystsolutions.eco/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fmapp/frontend;
    index index.html;

    location / {
