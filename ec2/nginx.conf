# Nginx configuration for FM_Instance (Amazon Linux 2023, ap-south-1)
# Place this file at: /etc/nginx/conf.d/fmapp.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;          # accepts requests on the public IP; replace with your domain if you have one

    # ── Frontend (React/Vite static build) ────────────────────────────────────
    root /var/www/fmapp/frontend;
    index index.html;

    # SPA fallback – all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (Node.js on port 4000) ────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Health-check endpoint (proxied from backend)
    location /health {
        proxy_pass         http://localhost:4000/health;
        proxy_set_header   Host $host;
    }

    # ── Static file uploads served directly ───────────────────────────────────
    location /uploads/ {
        alias /var/www/fmapp/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
