# Nginx configuration for FM Instance (Amazon Linux 2023, ap-south-1)
# Domain: catalystservices.eco  →  EC2 3.110.166.39
#
# Place this file at: /etc/nginx/conf.d/fmapp.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name catalystservices.eco www.catalystservices.eco fm.catalystsolutions.eco 3.110.166.39;

    # Allow Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name catalystservices.eco www.catalystservices.eco fm.catalystsolutions.eco;

    ssl_certificate     /etc/letsencrypt/live/catalystservices.eco/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalystservices.eco/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Frontend (React/Vite static build) ────────────────────────────────────
    root /var/www/fmapp/frontend/dist;
    index index.html;

    # Vite hashed assets – serve directly; never fall back to SPA index.html.
    # Without this, Nginx returns index.html (text/html) for missing .js files
    # which causes "Failed to load module script: wrong MIME type" in browsers.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback – all other unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (Node.js on port 4000) ────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Health-check endpoint
    location /health {
        proxy_pass       http://localhost:4000/health;
        proxy_set_header Host $host;
    }

    # ── Static file uploads served directly ───────────────────────────────────
    location /uploads/ {
        alias  /var/www/fmapp/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
