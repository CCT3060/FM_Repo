# Nginx HTTP-only config for FM_Instance
# Used ONLY during initial certbot setup (before SSL certs exist).
# Once certbot succeeds the deploy workflow replaces this with nginx.conf.
#
# Place at: /etc/nginx/conf.d/fmapp.conf  (temporarily)

server {
    listen 80;
    listen [::]:80;
    server_name fm.catalystsolutions.eco _;

    # ── Let's Encrypt HTTP-01 challenge ─────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Backend API (Node.js on port 4000) ───────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Health-check
    location /health {
        proxy_pass       http://localhost:4000/health;
        proxy_set_header Host $host;
    }

    # Static uploads
    location /uploads/ {
        alias  /var/www/fmapp/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend (React/Vite SPA) ─────────────────────────────────────────────
    root  /var/www/fmapp/frontend;
    index index.html;

    # Vite hashed assets – serve directly; never fall back to SPA index.html.
    # Without this, Nginx returns index.html (text/html) for missing .js files
    # which causes "Failed to load module script: wrong MIME type" in browsers.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
}
