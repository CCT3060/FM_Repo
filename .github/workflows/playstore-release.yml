name: Android Play Store Release

on:
  workflow_dispatch:   # Manual trigger — run from GitHub Actions UI

permissions:
  contents: read

concurrency:
  group: playstore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB & Submit to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1b. Guard: validate required secrets ─────────────────────────────────
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ]                  && missing="$missing EXPO_TOKEN"
          [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]  && missing="$missing GOOGLE_SERVICE_ACCOUNT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Secrets:$missing"
            echo ""
            echo "  EXPO_TOKEN               → https://expo.dev/settings/access-tokens"
            echo "  GOOGLE_SERVICE_ACCOUNT_KEY → base64-encoded Google Play service account JSON"
            echo "    How to encode: base64 -w 0 service-account.json"
            exit 1
          fi
        env:
          EXPO_TOKEN:                ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm ci

      # ── 3. Write Google service account key ──────────────────────────────────
      - name: Write Google service account key
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}" | base64 -d > /tmp/google-service-account.json

      # ── 4. Build & submit via EAS ─────────────────────────────────────────────
      #   EAS builds the AAB in the cloud, then submits it to Play Store directly.
      #   Required secrets:
      #     EXPO_TOKEN               → Expo access token
      #     GOOGLE_SERVICE_ACCOUNT_KEY → base64(service-account.json) from Play Console
      - name: Build and submit to Play Store via EAS
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build --platform android --profile production --non-interactive
          npx eas submit --platform android --latest --non-interactive \
            --path /tmp/google-service-account.json

      # ── 5. Clean up key file ──────────────────────────────────────────────────
      - name: Clean up service account key
        if: always()
        run: rm -f /tmp/google-service-account.json
