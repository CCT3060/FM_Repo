name: Android Play Store Release

on:
  workflow_dispatch:   # Manual trigger only — run from GitHub Actions UI
  # Uncomment the block below once EXPO_TOKEN, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
  # secrets are configured, to enable automatic releases on mobile-app changes:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'mobile-app/**'

# Required for Workload Identity Federation OIDC token exchange (keyless)
permissions:
  id-token: write
  contents: read

concurrency:
  group: playstore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB & Upload to Play Store (Keyless WIF)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1b. Guard: validate required secrets are configured ─────────────────
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ]            && missing="$missing EXPO_TOKEN"
          [ -z "$WIF_PROVIDER" ]          && missing="$missing WIF_PROVIDER"
          [ -z "$WIF_SERVICE_ACCOUNT" ]   && missing="$missing WIF_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Secrets:$missing"
            echo ""
            echo "  EXPO_TOKEN          → https://expo.dev/settings/access-tokens"
            echo "  WIF_PROVIDER        → GCP Workload Identity pool provider resource name"
            echo "  WIF_SERVICE_ACCOUNT → GCP service account email for Play uploads"
            echo ""
            echo "See PLAYSTORE_DEPLOYMENT_GUIDE.md for full setup instructions."
            exit 1
          fi
        env:
          EXPO_TOKEN:          ${{ secrets.EXPO_TOKEN }}
          WIF_PROVIDER:        ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ── 2. Node ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm ci

      # ── 3. EAS Cloud Build → get AAB artifact URL ───────────────────────────
      - name: Build production AAB via EAS Cloud
        id: build
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS production build..."
          BUILD_OUTPUT=$(npx eas build \
            --platform android \
            --profile production \
            --non-interactive 2>&1)
          echo "$BUILD_OUTPUT"

          AAB_URL=$(echo "$BUILD_OUTPUT" | grep -oP 'https://expo\.dev/artifacts/eas/\S+\.aab' | tail -1)
          if [ -z "$AAB_URL" ]; then
            echo "::error::Could not extract AAB URL from EAS output. Build may have failed."
            exit 1
          fi
          echo "Extracted AAB URL: $AAB_URL"
          echo "AAB_URL=$AAB_URL" >> "$GITHUB_ENV"
          echo "aab_url=$AAB_URL"  >> "$GITHUB_OUTPUT"

      # ── 4. Download the AAB ──────────────────────────────────────────────────
      - name: Download AAB artifact
        run: |
          echo "Downloading from: $AAB_URL"
          curl -L --fail --retry 3 "$AAB_URL" -o app-release.aab
          ls -lh app-release.aab

      # ── 5. Keyless Google auth via Workload Identity Federation ──────────────
      #   No JSON key file is downloaded or stored.
      #   GitHub provides a short-lived OIDC token; Google exchanges it for a
      #   short-lived access token scoped only to this run.
      #
      #   Required secrets:
      #     WIF_PROVIDER  → projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
      #     WIF_SERVICE_ACCOUNT → play-uploader@PROJECT_ID.iam.gserviceaccount.com
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ── 6. Python + Google Play API upload ──────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Play API client
        run: pip install google-api-python-client google-auth

      - name: Upload AAB to Google Play (internal track, draft)
        run: python3 .github/scripts/upload_play.py
        env:
          # ADC automatically picks up the short-lived credential file from WIF
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          AAB_PATH: app-release.aab
          PACKAGE_NAME: com.cct123.mobileapp
          PLAY_TRACK: internal
          RELEASE_STATUS: draft
