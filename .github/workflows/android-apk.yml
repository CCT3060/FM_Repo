name: Android APK Build

on:
  push:
    branches: [develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      # ── 3. Java (required by Gradle) ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Restore Gradle cache ──────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile-app/android/**/*.gradle*', 'mobile-app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 6. Install JS dependencies ───────────────────────────────────────────
      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      # ── 7. Generate native Android project via Expo Prebuild ─────────────────
      - name: Expo Prebuild (generate Android project)
        working-directory: mobile-app
        run: npx expo prebuild --platform android --clean --no-install

      # ── 8. Build Debug APK (no signing needed — for internal testing) ─────────
      - name: Build APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 9. Rename APK with date ───────────────────────────────────────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          APK_SRC=$(find mobile-app/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          mkdir -p artifacts
          cp "$APK_SRC" "artifacts/fmapp-develop-${DATE}.apk"

      # ── 10. Upload APK as downloadable artifact (kept 30 days) ───────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmapp-apk
          path: artifacts/*.apk
          retention-days: 30
