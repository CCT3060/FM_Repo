name: Deploy to EC2 (FM_Instance – ap-south-1)

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to FM_Instance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Build frontend ─────────────────────────────────────────────────────
      # VITE_API_URL is left empty so all /api/* calls are relative to the same
      # origin — Nginx on EC2 proxies them to the backend automatically.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "http://13.203.194.93"

      # ── 4. Write SSH private key ──────────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/fm_ec2.pem
          chmod 600 ~/.ssh/fm_ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ── 5. Deploy frontend (rsync dist/ to EC2) ───────────────────────────────
      - name: Deploy frontend static files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/fmapp/frontend/

      # ── 6. Deploy backend (rsync source, excluding secrets & node_modules) ────
      - name: Deploy backend source
        run: |
          rsync -az --delete \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='uploads/' \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/fmapp/backend/

      # ── 7. Remote: install dependencies & restart backend via PM2 ─────────────
      - name: Install backend deps & restart PM2
        run: |
          ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/fmapp/backend
            npm ci --omit=dev
            # Reload if already running; start fresh using absolute node path if not
            pm2 reload fmapp-backend 2>/dev/null || \
              pm2 start /var/www/fmapp/ec2/pm2.ecosystem.config.js --env production
            pm2 save --force
          ENDSSH

      # ── 8. Clean up SSH key ───────────────────────────────────────────────────
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/fm_ec2.pem
