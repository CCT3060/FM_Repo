name: Deploy to EC2 (FM_Instance – ap-south-1)

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ec2/**'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to FM_Instance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Build frontend ─────────────────────────────────────────────────────
      # VITE_API_URL is left empty so all /api/* calls are relative to the same
      # origin — Nginx on EC2 proxies them to the backend automatically.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "https://fm.catalystsolutions.eco"

      # ── 4. Write SSH private key ──────────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/fm_ec2.pem
          chmod 600 ~/.ssh/fm_ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ── 5. Deploy frontend (rsync dist/ to EC2) ───────────────────────────────
      - name: Deploy frontend static files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/fmapp/frontend/

      # ── 6. Deploy backend (rsync source, excluding secrets & node_modules) ────
      - name: Deploy backend source
        run: |
          rsync -az --delete \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='uploads/' \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/fmapp/backend/

      # ── 7. Deploy Nginx configs (full HTTPS + HTTP-only fallback) ───────────────
      - name: Deploy Nginx configs
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            ec2/nginx.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/fmapp-nginx.conf
          rsync -az \
            -e "ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no" \
            ec2/nginx-http.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/fmapp-nginx-http.conf

      # ── 8. Remote: apply nginx config, provision SSL, install deps, restart PM2 ──
      - name: Install backend deps & restart PM2
        run: |
          ssh -i ~/.ssh/fm_ec2.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            sudo mkdir -p /var/www/certbot

            # ── SSL certificate: configure nginx and optionally provision cert ──
            if sudo test -f /etc/letsencrypt/live/fm.catalystsolutions.eco/fullchain.pem; then
              echo "SSL certs found — applying HTTPS nginx config."
              sudo cp /tmp/fmapp-nginx.conf /etc/nginx/conf.d/fmapp.conf
            else
              echo "No SSL certs — applying HTTP-only nginx config."
              sudo cp /tmp/fmapp-nginx-http.conf /etc/nginx/conf.d/fmapp.conf
            fi

            sudo nginx -t && sudo systemctl reload nginx

            # ── Try to obtain SSL cert (non-fatal if DNS not set yet) ──────────
            if ! sudo test -f /etc/letsencrypt/live/fm.catalystsolutions.eco/fullchain.pem; then
              echo "Attempting certbot (requires DNS A record fm → 13.203.194.93)..."
              sudo dnf install -y python3-certbot-nginx 2>/dev/null || true
              if sudo certbot certonly --webroot \
                   -w /var/www/certbot \
                   -d fm.catalystsolutions.eco \
                   --non-interactive --agree-tos \
                   -m admin@catalystsolutions.eco; then
                echo "Certbot succeeded — switching to full HTTPS config."
                sudo cp /tmp/fmapp-nginx.conf /etc/nginx/conf.d/fmapp.conf
                sudo nginx -t && sudo systemctl reload nginx
              else
                echo "Certbot failed (DNS not ready?) — site stays on HTTP for now."
              fi
            fi

            # ── Install backend deps and restart PM2 ──────────────────────────
            cd /var/www/fmapp/backend
            sudo npm ci --omit=dev
            pm2 reload fmapp-backend 2>/dev/null || \
              pm2 start /var/www/fmapp/ec2/pm2.ecosystem.config.js --env production
            pm2 save --force
          ENDSSH

      # ── 9. Clean up SSH key ───────────────────────────────────────────────────
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/fm_ec2.pem
